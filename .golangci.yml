version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - bodyclose
    - errorlint
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (io.Closer).Close
        - (*os.File).Close
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
